name: verify

# 只跑"本机已经验证过"的检查：lint（Biome）、约定守卫、四个 node 套件。
# 刻意**没有** typecheck：本机没有 tsc、也没有网络可安装，塞一个未校准的配置只会让 CI 首跑就红。
# 补法见 README「工程化」一节（P5.7b）。
#
# 平台选 windows-latest：这些套件是在 Windows 上开发并验证的（含 `link-dev-deps` 的
# junction 处理），先保证"跑过的那套环境是绿的"；Linux 覆盖留到确认过再说。

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: windows-latest
    steps:
      # 两个 action 都停在 v5（= 首批声明 `runs.using: node24` 的主版本），用来消掉"目标 Node.js 20、
      # 被强制跑在 Node.js 24 上"的弃用警告：v4 声明的是 node20，Node 20 于 2026-09-23 从 runner 移除。
      # 只升到 v5、不追 v6/v7：checkout v6 起改掉了 `pull_request_target` 的检出默认值（改成需显式
      # `allow-unsafe-pr-checkout`），本工作流只用 push/pull_request 虽然不受影响，但没必要为消警告
      # 多引入一个变量；setup-node v5 的自动缓存只在 package.json 有 `packageManager` 字段时生效，
      # 本仓库没有该字段，所以缓存行为没有变化。v5 要求 runner ≥ v2.327.1，托管 runner 远高于此。
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      # CI 里没有 dsh 安装（本机是从 profile 软链宿主包的），所以从 registry 装齐宿主依赖。
      # ⚠️ 这里**不能**加 `--legacy-peer-deps`（2026-09-10 CI 首跑 exit 1 的根因）：
      #    npm 11 在该 flag 下会**静默跳过**"命令行点名、但又在 package.json 的 peerDependencies 里
      #    出现过"的包——@deepseek-ai/dsh-llm 与 react 就这么被丢了，退出码仍是 0，本步看起来是绿的；
      #    直到 `pretest` 的 link-dev-deps 既解析不到宿主包、又找不到 dsh 安装，才以 exit 1 把 verify 拖红。
      #    实测（同一份 package.json、同一台 Windows / Node 24 / npm 11.13）：带该 flag 只装进 16 个包且缺
      #    dsh-llm（`npm test` 随之 exit 1）；去掉后装进 28 个包、react/react-dom 精确配成 18.3.1，
      #    且没有 ERESOLVE——react 18.3.1 本来就满足 peer 声明的 ^18.2.0，本来不需要跳过 peer 解析。
      # ⚠️ 版本按"验证过的那一版 dsh"写死；dsh 升级后这几行要跟着调。
      # 当前钉 0.2.0-rc.2（= package.json `dsh.engines` 要求的最低版）：插件已适配 dsh 0.2.0
      # 的设置通道（Config schema 自动投影），不再注册 settings 命名空间。
      # ⚠️ 不要再装 `@deepseek-ai/dsh-settings-file`：0.2.0 已移除该包。装了旧版反而会把
      #    test/settings-activation.mjs 拖进旧路径跑（旧 settings 服务要求 registerNamespace，
      #    插件已不再调用）→ 7 个用例红（2026-10-03 CI exit 1 的根因）。不装它，该套件会按
      #    设计 SKIP（exit 0），与本地行为一致；端到端验证走 README 的真机步骤。
      - name: 安装宿主依赖与工具
        run: >
          npm install --no-save --no-audit --no-fund
          @deepseek-ai/dsh-llm@0.2.0-rc.2
          @deepseek-ai/schemastery@^3
          @deepseek-ai/cordis@^4
          @deepseek-ai/dsh-settings@0.2.0-rc.2
          react@18.3.1
          react-dom@18.3.1
          @biomejs/biome@^2.5.8

      # 上一步一旦重回"静默跳过"模式（换 flag、换 npm 版本都可能），这里必须红，
      # 而不是把问题一路推到测试步骤里那句容易被误读的"找不到 dsh 安装"。
      # `npm ls` 只校验 package.json 里声明过的依赖，而被静默跳过的恰好就是那三个 peer
      # （@deepseek-ai/dsh-llm / react / @deepseek-ai/schemastery）：装齐时 exit 0（多出来的
      # extraneous 条目不算错），缺任何一个都 exit 1。
      # 另一个会 exit 1 的情形是 peer **invalid**（2026-10-05 实测）：peer 范围与这里钉的版本
      # 冲突（如 dsh-llm 写 ">=0.1.2-rc.1" 时，semver 不把 0.2.0-rc.2 这类不同元组的预发布
      # 版算进范围）。所以升级这里的版本时，peerDependencies 的下限必须同步调。
      - name: 校验宿主依赖真的装进来了
        run: npm ls --depth=0

      - name: lint（Biome，只 lint 不 format）
        run: npm run lint

      # `npm test` 会先跑约定守卫，再跑宿主半 / 浏览器半 / 真 React / 真框架集成四个套件。
      # pretest 的 link-dev-deps 在 CI 里会发现依赖已可从仓库解析，安静跳过。
      # 真框架集成套件（settings-activation）钉着旧的 dsh-settings-file 提供者，0.2.0 下会
      # SKIP（exit 0）——与本地一致，不是回归；套件重写后这里会恢复为真实执行。
      # 顺带一提：CI 用的是 react 18（本机那对是 19），所以真 React 套件在两条版本上都跑。
      - name: 测试
        run: npm test
